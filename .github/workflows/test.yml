name: End-to-end test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "21.1.8"
      - name: Update APT repositories
        run: sudo apt update
      - name: Install dependencies
        run: sudo apt install -y inotify-tools libgmock-dev bridge-utils gcc-multilib libgmp-dev libmpfr-dev libmpc-dev isc-dhcp-client nftables
      - name: Run test
        run: sudo --preserve-env=PATH ./run.py test_e2e
      # - name: Debug with tmate on failure
      #   if: ${{ failure() }}
      #   uses: mxschmitt/action-tmate@v3
